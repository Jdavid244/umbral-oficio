name: Deploy to GitHub Pages
on:
  push:
    branches: [main, v2-liquid-glass]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build v2 if branch exists
        run: |
          if git ls-remote --exit-code --heads origin v2-liquid-glass; then
            git fetch origin v2-liquid-glass
            git worktree add ../v2 origin/v2-liquid-glass
            cd ../v2 && npm ci && npm run build
            mkdir -p $GITHUB_WORKSPACE/dist/v2 && cp -r dist/. $GITHUB_WORKSPACE/dist/v2/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
